<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AfriChat — Discute avec ton Tonton</title>
  <style>
    :root {
      --bg: #1a1208;
      --panel: #2a1f10;
      --panel-2: #3d2e18;
      --accent: #e8a317;
      --accent-2: #c45c26;
      --text: #f5ead6;
      --muted: #b8a88a;
      --user: #5c3d1e;
      --bot: #243018;
      --border: rgba(232, 163, 23, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #3d2812 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(26, 18, 8, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    header p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .status {
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .status.ok { color: #8fd48a; border-color: rgba(143, 212, 138, 0.4); }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .msg {
      max-width: 85%;
      padding: 0.9rem 1.1rem;
      border-radius: 1rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border: 1px solid rgba(232, 163, 23, 0.2);
      border-bottom-right-radius: 0.25rem;
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0.25rem;
    }

    .msg .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.35rem;
      font-weight: 600;
    }

    .welcome {
      text-align: center;
      color: var(--muted);
      padding: 2rem 1rem;
    }

    .welcome h2 {
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .suggestions button {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .suggestions button:hover { background: var(--accent-2); }

    footer {
      padding: 1rem 1.5rem 1.5rem;
      border-top: 1px solid var(--border);
      background: rgba(26, 18, 8, 0.9);
    }

    .input-row {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 52px;
      max-height: 160px;
      padding: 0.85rem 1rem;
      border-radius: 0.85rem;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      line-height: 1.4;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    button#send {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #1a1208;
      border: none;
      border-radius: 0.85rem;
      padding: 0.85rem 1.25rem;
      font-weight: 700;
      cursor: pointer;
      min-width: 96px;
    }

    button#send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing::after {
      content: "▋";
      animation: blink 0.8s step-end infinite;
      color: var(--accent);
    }

    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🇨🇮 AfriChat</h1>
      <p>Ton gars d'Abidjan — on discute de tout, cash</p>
    </div>
    <div class="status" id="status">Connexion...</div>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <h2>Yo frérot, c'est comment ?</h2>
      <p>Foot, bouffe, boulot, life — on parle de tout.</p>
      <div class="suggestions">
        <button type="button">Le foot c'est la vie non ?</button>
        <button type="button">Tu connais un bon garba ?</button>
        <button type="button">Mon boss me saoule là</button>
      </div>
    </div>
  </main>

  <footer>
    <form class="input-row" id="form">
      <textarea id="input" rows="1" placeholder="Écris ton message..." autocomplete="off"></textarea>
      <button type="submit" id="send">Envoyer</button>
    </form>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const welcome = document.getElementById("welcome");

    const history = [];
    let busy = false;

    async function checkHealth() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        statusEl.textContent = data.status === "ok" ? "En ligne" : "Chargement...";
        statusEl.classList.toggle("ok", data.status === "ok");
      } catch {
        statusEl.textContent = "Hors ligne";
      }
    }

    function addMessage(role, content, streaming = false) {
      welcome?.remove();
      const div = document.createElement("div");
      div.className = `msg ${role}` + (streaming ? " typing" : "");
      div.innerHTML = `<div class="label">${role === "user" ? "Toi" : "AfriChat 🇨🇮"}</div><div class="body"></div>`;
      div.querySelector(".body").textContent = content;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage(text) {
      if (!text.trim() || busy) return;
      busy = true;
      sendBtn.disabled = true;

      history.push({ role: "user", content: text.trim() });
      addMessage("user", text.trim());
      input.value = "";

      const botDiv = addMessage("assistant", "", true);
      const body = botDiv.querySelector(".body");
      let reply = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history, stream: true, max_new_tokens: 96, temperature: 0.82, top_p: 0.92 }),
        });

        if (!res.ok) throw new Error(await res.text());

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          for (const line of chunk.split("\n")) {
            if (!line.startsWith("data: ")) continue;
            const payload = line.slice(6);
            if (payload === "[DONE]") continue;
            const data = JSON.parse(payload);
            if (data.error) throw new Error(data.error);
            reply += data.content;
            body.textContent = reply;
            chat.scrollTop = chat.scrollHeight;
          }
        }

        botDiv.classList.remove("typing");
        history.push({ role: "assistant", content: reply });
      } catch (err) {
        botDiv.classList.remove("typing");
        body.textContent = "Désolé mon petit, une erreur est survenue : " + err.message;
      }

      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(input.value);
      }
    });

    document.querySelectorAll(".suggestions button").forEach((btn) => {
      btn.addEventListener("click", () => sendMessage(btn.textContent));
    });

    checkHealth();
    setInterval(checkHealth, 15000);
    input.focus();
  </script>
</body>
</html>
